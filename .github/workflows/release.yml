# Release workflow for @overturo/sdk. Runs on this repository's version
# tag, builds the package from this tree and publishes it with the registry's
# short-lived trusted-publisher credential. No token is stored anywhere.
#
# First version: until the repository variable OVERTURO_PUBLISH is set, the
# workflow builds and keeps the artefact without publishing (a trusted publisher
# on npm can only be named for a package that already exists; a maintainer
# publishes the first version from a session, names the publisher, then sets
# the variable). A version the registry already serves is left alone, so a
# re-run is never red. This workflow never commits, tags or pushes.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.5.1   # trusted publishing needs a newer npm than Node bundles
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: "*.tgz"
      - name: First version — not published by this run
        if: vars.OVERTURO_PUBLISH == ''
        run: echo "::notice::OVERTURO_PUBLISH is not set on this repository. Publish ${{ steps.v.outputs.version }} from a maintainer session, name the trusted publisher, then set the variable."
      - name: Publish
        if: vars.OVERTURO_PUBLISH != ''
        run: |
          if npm view "@overturo/sdk@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::@overturo/sdk@${{ steps.v.outputs.version }} is already on the registry; nothing to publish"
          else
            npm publish --access public ./*.tgz
          fi
